services:
  - type: web
    name: legalprop-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash render_build.sh
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 65
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_MODEL
        sync: false
      - key: XAI_FALLBACK_MODELS
        sync: false
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.1-flash-lite,gemini-3.5-flash-lite
      - key: XAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: MASTER_ADMIN_NAME
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: ./storage/vector_store
